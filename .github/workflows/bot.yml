name: BIST Bot

on:
  schedule:
    - cron: "30 15 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "0 17 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aksam:
    if: github.event.schedule == '30 15 * * 1-5' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      MODE: aksam
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklar
        run: pip install -q -r requirements.txt
      - name: Botu calistir
        run: python bot.py
      - name: Hafizayi kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gecmis_v15.json plan.json bist_history.csv trades_history.json || true
          if ! git diff --cached --quiet; then
            git commit -m "hafiza $(date -u +%Y-%m-%d)"
            git push
          fi

  sabah:
    if: github.event.schedule == '30 6 * * 1-5'
    runs-on: ubuntu-latest
    env:
      MODE: sabah
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklar
        run: pip install -q -r requirements.txt
      - name: Sabah briefi
        run: python bot.py

  backtest:
    if: github.event.schedule == '0 17 * * 0'
    runs-on: ubuntu-latest
    env:
      MODE: backtest
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bagimliliklar
        run: pip install -q -r requirements.txt
      - name: Backtest
        run: python bot.py

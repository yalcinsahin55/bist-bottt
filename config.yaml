# Risk parametreleri
risk:
  max_pozisyon: 5
  max_sektor: 2
  max_kasa_yuzde: 0.20
  firtina_max_pozisyon: 2
  stop_atr_carpan: 2.0
  stop_min_pct: 0.03
  stop_max_pct: 0.08
  hedef_risk_odul: 1.8
  max_tutma_gun: 10
  min_mcap: 2000000000
  min_rec: -0.5
  rsi_ust_limit: 75
  min_tahmin: 0.0
  # Yeni
  max_correlation: 0.75          # Yüksek korelasyonlu hisseleri ele
  trailing_aktif: true
  trailing_aktivasyon_pct: 0.04  # %4 kârda trailing başlar
  trailing_mesafe_pct: 0.025     # Trailing stop mesafesi
  partial_tp_aktif: true
  partial_tp_pct: 0.06           # %6 kârda yarısını sat
  partial_tp_oran: 0.5           # Pozisyonun yarısı

# Model
model:
  n_estimators: 150
  max_depth: 4
  learning_rate: 0.05
  min_train_rows: 120
  prediction_horizon: 5

# Veri
data:
  yfinance_guncelle: true        # Akşam koşusunda yf ile OHLCV zenginleştir
  yfinance_max_hisse: 40         # Her seferde max kaç hisse çekilsin
  yfinance_period: "1y"

# Dosya yolları
files:
  hafiza: gecmis_v15.json
  plan: plan.json
  csv: bist_history.csv
  trades: trades_history.json    # Kapalı işlem geçmişi
  log: bot.log
